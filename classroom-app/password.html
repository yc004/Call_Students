<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码验证</title>
  <link rel="stylesheet" href="password.css">
</head>
<body>

<div class="title-bar-ctrl win-abs">
  <button class="win-btn win-min" onclick="api.winMinimize()" title="最小化"></button>
  <button class="win-btn win-close" onclick="api.winClose()" title="关闭"></button>
</div>

<div class="pwd-container">
  <h2>🔒 教室管理</h2>
  <p class="pwd-hint">请输入管理密码</p>
  <input type="password" id="passwordInput" placeholder="输入密码…" maxlength="32" autofocus>
  <p id="errorMsg" class="pwd-error hidden">密码错误，请重试</p>
  <div class="pwd-actions">
    <button id="cancelBtn" class="btn">取消</button>
    <button id="confirmBtn" class="btn btn-primary">确认</button>
  </div>
</div>

<script src="password.js"></script>
</body>
</html>
