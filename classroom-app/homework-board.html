<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作业看板</title>
  <link rel="stylesheet" href="homework-board.css">
</head>
<body>

<!-- 工具栏（拖拽区域：CSS -webkit-app-region: drag） -->
<div class="board-toolbar">
  <span class="board-title">📊 作业看板</span>
  <span class="board-info" id="boardInfo"></span>
  <input type="date" id="boardDateFilter" class="board-filter no-drag">
  <select id="boardSubjectFilter" class="board-filter no-drag"><option value="">全部学科</option></select>
  <select id="boardAssignFilter" class="board-filter no-drag"><option value="">全部作业</option></select>
  <select id="boardStatusFilter" class="board-filter no-drag"><option value="">全部状态</option></select>
  <button class="board-btn no-drag" id="addHwBtn" title="新建作业">＋ 新建</button>
  <button class="board-btn no-drag" id="refreshBtn" title="刷新">🔄</button>
  <span style="flex:1"></span>
  <span class="title-bar-ctrl no-drag">
    <button class="win-btn win-min" onclick="api.winMinimize()" title="最小化"></button>
    <button class="win-btn win-max" onclick="api.winMaximize()" title="最大化"></button>
    <button class="win-btn win-close" id="closeBtn" title="关闭"></button>
  </span>
</div>

<!-- 表格 -->
<div id="boardTableWrap" class="board-table-wrap">
  <div id="boardEmpty" class="board-empty">今天没有作业<button id="addFirstBtn">＋ 添加作业</button></div>
</div>

<!-- 调试栏 -->
<div id="boardDebug" class="board-debug">⏳ 初始化…</div>

<!-- 添加作业弹窗 -->
<div id="addModal" class="b-modal hidden">
  <div class="b-modal-card">
    <h3>添加作业</h3>
    <label class="b-label">学科</label>
    <select id="addSubject" class="b-input"></select>
    <label class="b-label">作业标题</label>
    <input type="text" id="addTitle" class="b-input" placeholder="例如：第一章练习" maxlength="50">
    <div class="b-modal-acts">
      <button id="addCancel" class="b-btn">取消</button>
      <button id="addConfirm" class="b-btn b-btn-primary">确定</button>
    </div>
  </div>
</div>

<script src="homework-board.js"></script>
</body>
</html>
