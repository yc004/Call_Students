<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: wss: ws:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸采集</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; }
    video { width:100%; height:100%; object-fit:cover; }
    canvas { display:none; }
    #status { position:absolute; bottom:2px; right:4px; color:#0f0; font-size:9px; font-family:monospace; opacity:0.8; pointer-events:none; }
  </style>
</head>
<body>
  <video id="fcVideo" autoplay playsinline muted></video>
  <canvas id="fcCanvas" width="320" height="240"></canvas>
  <span id="status"></span>
  <script src="../shared/error-report.js"></script>
  <script src="../../node_modules/face-api.js/dist/face-api.min.js"></script>
  <script src="face-check.js"></script>
</body>
</html>
