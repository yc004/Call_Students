<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: wss: ws:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级安排入口</title>
  <link rel="stylesheet" href="homework-float.css">
</head>
<body>
  <div id="floatShell" class="float-shell" title="拖动可移动入口">
    <div id="floatMenu" class="float-menu" hidden>
      <button id="openBoard" class="menu-ball stats-ball" type="button" aria-label="打开提交情况"><strong>提交</strong><span>情况</span></button>
      <button id="openWidget" class="menu-ball display-ball" type="button" aria-label="打开今日安排"><strong>今日</strong><span>安排</span></button>
    </div>
    <button id="toggleMenu" class="main-ball" type="button" aria-label="展开作业菜单" aria-expanded="false">
      <span id="unreadDot" class="unread-dot" aria-hidden="true" hidden></span>
      <span class="book-mark">今日</span><span class="open-hint">安排</span>
    </button>
  </div>
  <script src="../shared/error-report.js"></script>
  <script src="homework-float.js"></script>
</body>
</html>
