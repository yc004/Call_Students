<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教室管理</title>
  <link rel="stylesheet" href="manage.css">
</head>
<body>

<!-- ══════════ 标题栏（通用组件：拖拽 + 窗口控制） ══════════ -->
<header class="title-bar">
  <div class="title-bar-left">
    <span class="title-bar-icon">🏫</span>
    <span class="title-bar-text">教室管理</span>
  </div>
  <div class="title-bar-ctrl">
    <button class="win-btn win-min" onclick="api.winMinimize()" title="最小化"></button>
    <button class="win-btn win-max" onclick="api.winMaximize()" title="最大化"></button>
    <button class="win-btn win-close" onclick="api.winClose()" title="关闭"></button>
  </div>
</header>

<div class="container">
  <h1>教室管理</h1>

  <!-- Tab 导航 -->
  <div class="tabs">
    <button class="tab active" data-tab="students">学生名单</button>
    <button class="tab" data-tab="homework">作业管理</button>
    <button class="tab" data-tab="settings">⚙ 设置</button>
    <button class="tab" data-tab="teachers">👨‍🏫 教师管理</button>
  </div>

  <!-- ══════════ 学生名单 Tab ══════════ -->
  <div class="tab-content" id="tab-students">
    <div class="field">
      <label for="className">班级名称</label>
      <input type="text" id="className" placeholder="例如：高一(3)班" autofocus>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>学生名单</h2>
        <div class="section-head-actions">
          <button id="importBtn" class="btn">📥 批量导入</button>
          <button id="addBtn" class="btn btn-primary">＋ 添加学生</button>
        </div>
      </div>
      <table id="studentTable">
        <thead>
          <tr><th style="width:60px">序号</th><th>姓名</th><th style="width:100px">操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="emptyHint" class="empty-hint">暂无学生，请点击右上角「添加学生」</div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn btn-primary btn-lg">保存</button>
      <span id="saveStatus" class="save-status"></span>
    </div>
  </div>

  <!-- ══════════ 作业管理 Tab ══════════ -->
  <div class="tab-content hidden" id="tab-homework">

    <!-- 学科 -->
    <div class="section">
      <div class="section-head">
        <h2>学科</h2>
        <button id="addSubjectBtn" class="btn btn-primary btn-sm">＋ 添加学科</button>
      </div>
      <div id="subjectTags" class="subject-tags">
        <span class="empty-hint">暂无学科，请先添加</span>
      </div>
    </div>

    <!-- 作业列表 -->
    <div class="section">
      <div class="section-head">
        <h2>作业</h2>
        <div class="section-head-actions">
          <select id="mgStatusFilter" class="mg-filter-select">
            <option value="">全部状态</option>
          </select>
          <input type="date" id="mgDateFrom" class="mg-date-input" title="开始日期">
          <span class="mg-date-sep">~</span>
          <input type="date" id="mgDateTo" class="mg-date-input" title="结束日期">
          <button id="addAssignmentBtn" class="btn btn-primary btn-sm">＋ 添加作业</button>
        </div>
      </div>
      <div id="assignmentList" class="hw-list">
        <span class="empty-hint">暂无作业</span>
      </div>
    </div>

    <div class="actions">
      <button id="hwSaveBtn" class="btn btn-primary btn-lg">保存</button>
      <span id="hwSaveStatus" class="save-status"></span>
    </div>
  </div>

  <!-- ══════════ 设置 Tab ══════════ -->
  <div class="tab-content hidden" id="tab-settings">
    <div class="section">
      <div class="section-head">
        <h2>🔒 管理密码</h2>
      </div>
      <p class="settings-hint">设置密码后，打开管理窗口和作业看板时需要输入密码验证。</p>
      <p class="settings-hint">未设置密码时，教师端可直接连接并进行所有操作。</p>

      <div id="pwdStatus" class="pwd-status">
        <span id="pwdStatusIcon">🔓</span>
        <span id="pwdStatusText">当前未设置密码</span>
      </div>

      <div class="pwd-form">
        <div class="field">
          <label for="oldPassword">当前密码</label>
          <input type="password" id="oldPassword" placeholder="留空表示当前无密码" maxlength="32">
        </div>
        <div class="field">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" placeholder="输入新密码…" maxlength="32">
        </div>
        <div class="field">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入新密码…" maxlength="32">
        </div>
        <div class="pwd-form-actions">
          <button id="setPasswordBtn" class="btn btn-primary">设置密码</button>
          <button id="clearPasswordBtn" class="btn btn-danger-outline">清除密码</button>
        </div>
        <span id="pwdMsg" class="save-status"></span>
      </div>
    </div>
  </div>

  <!-- ══════════ 教师管理 Tab ══════════ -->
  <div class="tab-content hidden" id="tab-teachers">
    <div class="section">
      <div class="section-head">
        <h2>待审核的加入请求</h2>
        <span id="pendingCount" class="badge hidden">0</span>
      </div>
      <table id="pendingTable">
        <thead><tr><th>姓名</th><th>角色</th><th>学科</th><th>请求时间</th><th style="width:140px">操作</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="noPending" class="empty-hint">暂无待审核的请求</div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>已批准的教师</h2>
        <button id="importTeacherBtn" class="btn btn-sm">📥 导入教师</button>
      </div>
      <table id="approvedTable">
        <thead><tr><th>姓名</th><th>角色</th><th>学科</th><th>批准时间</th><th style="width:120px">操作</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="noApproved" class="empty-hint">暂无已批准的教师</div>
    </div>

    <!-- 编辑教师弹窗 -->
    <div id="editTeacherModal" class="modal hidden">
      <div class="modal-card">
        <h3>编辑教师</h3>
        <div class="field"><label>姓名</label><input type="text" id="editTeacherName" disabled></div>
        <div class="field"><label>角色</label><select id="editTeacherRole"><option value="班主任">班主任</option><option value="授课教师">授课教师</option></select></div>
        <div class="field" id="editSubjectsField"><label>学科（逗号分隔）</label><input type="text" id="editTeacherSubjects" placeholder="数学, 语文"></div>
        <div class="modal-actions">
          <button id="editTeacherCancel" class="btn">取消</button>
          <button id="editTeacherConfirm" class="btn btn-primary">确定</button>
        </div>
        <input type="hidden" id="editTeacherId">
      </div>
    </div>

    <!-- 导入教师弹窗 -->
    <div id="importTeacherModal" class="modal hidden">
      <div class="modal-card modal-wide">
        <h3>导入教师</h3>
        <p class="modal-hint">粘贴教师导出的连接信息（JSON格式）</p>
        <textarea id="importTeacherData" rows="3" placeholder='{"connectionId":"...","name":"张老师"}'></textarea>
        <div class="field"><label>角色</label><select id="importTeacherRole"><option value="班主任">班主任</option><option value="授课教师">授课教师</option></select></div>
        <div class="field" id="importSubjectsField"><label>学科（逗号分隔）</label><input type="text" id="importTeacherSubjects" placeholder="数学, 语文"></div>
        <div class="modal-actions">
          <button id="importTeacherCancel" class="btn">取消</button>
          <button id="importTeacherConfirm" class="btn btn-primary">导入并批准</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 学生弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modalTitle">添加学生</h3>
    <input type="text" id="studentName" placeholder="学生姓名" maxlength="20">
    <div class="modal-actions">
      <button id="modalCancel" class="btn">取消</button>
      <button id="modalConfirm" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

<!-- 批量导入弹窗 -->
<div id="importModal" class="modal hidden">
  <div class="modal-card modal-wide">
    <h3>批量导入学生</h3>
    <p class="modal-hint">每行一个姓名，或用空格 / 逗号 / 顿号分隔</p>
    <textarea id="importText" rows="10" placeholder="张三&#10;李四&#10;王五"></textarea>
    <div class="modal-actions">
      <button id="importCancel" class="btn">取消</button>
      <button id="importConfirm" class="btn btn-primary">导入</button>
    </div>
  </div>
</div>

<!-- 学科弹窗 -->
<div id="subjectModal" class="modal hidden">
  <div class="modal-card">
    <h3>添加学科</h3>
    <input type="text" id="subjectName" placeholder="学科名称，例如：数学" maxlength="20">
    <div class="modal-actions">
      <button id="subjectModalCancel" class="btn">取消</button>
      <button id="subjectModalConfirm" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

<!-- 作业弹窗 -->
<div id="assignmentModal" class="modal hidden">
  <div class="modal-card modal-wide">
    <h3 id="assignmentModalTitle">添加作业</h3>
    <label class="field-label">学科</label>
    <select id="assignmentSubject" class="field-select"></select>
    <label class="field-label">作业标题</label>
    <input type="text" id="assignmentTitle" placeholder="例如：第一章练习" maxlength="50">
    <label class="field-label">日期</label>
    <input type="date" id="assignmentDate">
    <div class="modal-actions">
      <button id="assignmentModalCancel" class="btn">取消</button>
      <button id="assignmentModalConfirm" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

<script src="manage.js"></script>
</body>
</html>
