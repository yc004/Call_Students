name: Build Installers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════
  #  教室端 (classroom-app) — Windows
  # ═══════════════════════════════════════════
  build-classroom:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: classroom-app

      - name: Download ONNX Runtime (Windows x64)
        run: |
          $version = "1.18.0"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-win-x64-${version}.zip"
          $cacheDir = "classroom-app/.cache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          $zipPath = "$cacheDir/onnxruntime-win-x64.zip"
          if (-not (Test-Path $zipPath)) {
            Invoke-WebRequest -Uri $url -OutFile $zipPath
          }
          $depsDir = "classroom-app/native/deps/onnxruntime"
          Expand-Archive -Path $zipPath -DestinationPath (New-Item -ItemType Directory -Force -Path "$cacheDir/onnx-extract").FullName -Force
          $extracted = Get-ChildItem "$cacheDir/onnx-extract" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$depsDir/include"
          Copy-Item -Recurse "$($extracted.FullName)/include/*" "$depsDir/include/"
          New-Item -ItemType Directory -Force -Path "$depsDir/lib"
          Copy-Item "$($extracted.FullName)/lib/onnxruntime.lib" "$depsDir/lib/" -ErrorAction SilentlyContinue
          Copy-Item "$($extracted.FullName)/lib/onnxruntime.dll" "$depsDir/lib/" -ErrorAction SilentlyContinue
          Copy-Item "$($extracted.FullName)/bin/onnxruntime.dll" "$depsDir/lib/" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Prepare verified face models
        run: npm run prepare:models
        working-directory: classroom-app

      - name: Build native addon
        run: npm run build:native
        working-directory: classroom-app

      - name: Verify JavaScript syntax
        run: npm run verify:syntax
        working-directory: classroom-app

      - name: Test native addon
        run: npm run test:native
        working-directory: classroom-app

      - name: Build Electron app
        run: npm run build
        working-directory: classroom-app

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-app-installer
          path: classroom-app/dist/*.exe

  # ═══════════════════════════════════════════
  #  教室端 (classroom-app) — macOS
  # ═══════════════════════════════════════════
  build-classroom-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: classroom-app

      - name: Download ONNX Runtime (macOS)
        run: |
          VERSION="1.18.0"
          ARCH=$(uname -m)
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${VERSION}/onnxruntime-osx-${ARCH}-${VERSION}.tgz"
          CACHE_DIR="classroom-app/.cache"
          mkdir -p "$CACHE_DIR"
          TARBALL="$CACHE_DIR/onnxruntime-osx-${ARCH}.tgz"
          if [ ! -f "$TARBALL" ]; then
            curl -L -o "$TARBALL" "$URL"
          fi
          DEPS_DIR="classroom-app/native/deps/onnxruntime"
          mkdir -p "$DEPS_DIR"
          TMPDIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TMPDIR"
          EXTRACTED=$(find "$TMPDIR" -maxdepth 1 -type d -name "onnxruntime-*" | head -1)
          rm -rf "$DEPS_DIR/include"
          cp -r "$EXTRACTED/include" "$DEPS_DIR/include"
          mkdir -p "$DEPS_DIR/lib"
          cp "$EXTRACTED/lib/libonnxruntime.${VERSION}.dylib" "$DEPS_DIR/lib/" 2>/dev/null || true
          (cd "$DEPS_DIR/lib" && ln -sf "libonnxruntime.${VERSION}.dylib" "libonnxruntime.dylib") 2>/dev/null || true
          rm -rf "$TMPDIR"

      - name: Prepare verified face models
        run: npm run prepare:models
        working-directory: classroom-app

      - name: Build native addon
        run: npm run build:native
        working-directory: classroom-app

      - name: Verify JavaScript syntax
        run: npm run verify:syntax
        working-directory: classroom-app

      - name: Test native addon
        run: npm run test:native
        working-directory: classroom-app

      - name: Build Electron app
        run: npx electron-builder --mac
        working-directory: classroom-app

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-app-mac
          path: classroom-app/dist/*.dmg

  # ═══════════════════════════════════════════
  #  教室端 (classroom-app) — Linux
  # ═══════════════════════════════════════════
  build-classroom-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libsecret-1-0

      - name: Install dependencies
        run: npm ci
        working-directory: classroom-app

      - name: Download ONNX Runtime (Linux x64)
        run: |
          VERSION="1.18.0"
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${VERSION}/onnxruntime-linux-x64-${VERSION}.tgz"
          CACHE_DIR="classroom-app/.cache"
          mkdir -p "$CACHE_DIR"
          TARBALL="$CACHE_DIR/onnxruntime-linux-x64.tgz"
          if [ ! -f "$TARBALL" ]; then
            curl -L -o "$TARBALL" "$URL"
          fi
          DEPS_DIR="classroom-app/native/deps/onnxruntime"
          mkdir -p "$DEPS_DIR"
          TMPDIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TMPDIR"
          EXTRACTED=$(find "$TMPDIR" -maxdepth 1 -type d -name "onnxruntime-*" | head -1)
          rm -rf "$DEPS_DIR/include"
          cp -r "$EXTRACTED/include" "$DEPS_DIR/include"
          mkdir -p "$DEPS_DIR/lib"
          cp "$EXTRACTED/lib/libonnxruntime.so.${VERSION}" "$DEPS_DIR/lib/" 2>/dev/null || true
          (cd "$DEPS_DIR/lib" && ln -sf "libonnxruntime.so.${VERSION}" "libonnxruntime.so") 2>/dev/null || true
          rm -rf "$TMPDIR"

      - name: Prepare verified face models
        run: npm run prepare:models
        working-directory: classroom-app

      - name: Build native addon
        run: npm run build:native
        working-directory: classroom-app

      - name: Verify JavaScript syntax
        run: npm run verify:syntax
        working-directory: classroom-app

      - name: Test native addon
        run: npm run test:native
        working-directory: classroom-app

      - name: Build Electron app
        run: npx electron-builder --linux
        working-directory: classroom-app

      - uses: actions/upload-artifact@v4
        with:
          name: classroom-app-linux
          path: classroom-app/dist/*.AppImage

  # ═══════════════════════════════════════════
  #  教师端 (teacher-app) — 无原生模块，保持原有构建
  # ═══════════════════════════════════════════
  build-teacher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: teacher-app
      - run: npm run verify:syntax
        working-directory: teacher-app
      - run: npm run build
        working-directory: teacher-app
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-app-installer
          path: teacher-app/dist/*.exe
