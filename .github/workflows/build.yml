name: Build Desktop Installers

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'
  ONNX_RUNTIME_VERSION: '1.18.0'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  validate:
    name: Validate source and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banda
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d banda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PUBLIC_URL: http://127.0.0.1:8080
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/banda
      ACCESS_TOKEN_SECRET: ci-access-token-secret-000000000000000000000000
      KEY_PEPPER: ci-key-pepper-000000000000000000000000000000
      SETUP_TOKEN: ci-setup-token-000000000000
      MACOS_SIGNING_READY: ${{ secrets.MACOS_CSC_LINK != '' && secrets.MACOS_CSC_KEY_PASSWORD != '' && secrets.MACOS_APPLE_ID != '' && secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.MACOS_APPLE_TEAM_ID != '' }}
      WINDOWS_SIGNING_READY: ${{ secrets.WINDOWS_CSC_LINK != '' && secrets.WINDOWS_CSC_KEY_PASSWORD != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate source
        run: |
          node .github/scripts/verify-release-metadata.js
          node .github/scripts/verify-branding.js
          node scripts/verify-js-syntax.js classroom-app
          node scripts/verify-js-syntax.js teacher-app
          node scripts/verify-js-syntax.js mini-program/src

      - name: Require signing credentials for tagged releases
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$WINDOWS_SIGNING_READY" == "true" ]] || { echo 'Windows signing credentials are required for a tagged release' >&2; exit 1; }
            [[ "$MACOS_SIGNING_READY" == "true" ]] || { echo 'macOS signing and notarization credentials are required for a tagged release' >&2; exit 1; }
          fi

      - name: Install teacher test dependencies
        working-directory: teacher-app
        run: npm ci

      - name: Run teacher tests
        run: |
          node --test teacher-app/test/*.test.js
          node --test mini-program/test/*.test.js
          cd teacher-app
          npm audit --omit=dev --audit-level=high
          npm sbom --package-lock-only --sbom-format cyclonedx > teacher-app.cdx.json

      - name: Install and test classroom app
        working-directory: classroom-app
        run: |
          npm ci
          node --test test/*.test.js
          npm audit --omit=dev --audit-level=high
          npm sbom --package-lock-only --sbom-format cyclonedx > classroom-app.cdx.json

      - name: Install and verify cloud server
        working-directory: cloud-server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm test
          pnpm audit --prod --audit-level high

      - name: Run cloud runtime integration tests
        working-directory: cloud-server
        run: |
          pnpm start > /tmp/banda-cloud.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/v2/system/ready && break
            sleep 1
          done
          pnpm test:runtime
          kill "$server_pid"

      - name: Type-check and build admin web
        working-directory: cloud-server/admin-web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm -F @vben/web-antd run typecheck
          pnpm run build:antd

      - name: Upload dependency inventories
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            classroom-app/classroom-app.cdx.json
            teacher-app/teacher-app.cdx.json
          if-no-files-found: error
          retention-days: 30

  cloud-container:
    name: Cloud server container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build production container
        uses: docker/build-push-action@v7
        with:
          context: cloud-server
          push: false
          provenance: mode=max
          sbom: true
          tags: banda-cloud:${{ github.sha }}

  classroom-windows:
    name: Classroom app (Windows x64)
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CSC_LINK != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: classroom-app/package-lock.json

      - name: Cache Electron toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-classroom-${{ hashFiles('classroom-app/package-lock.json') }}

      - name: Cache ONNX Runtime and verified models
        uses: actions/cache@v5
        with:
          path: |
            classroom-app/.cache/onnxruntime
            classroom-app/models/onnx/*.onnx
          key: windows-native-${{ env.ONNX_RUNTIME_VERSION }}-${{ hashFiles('classroom-app/models/onnx/models.json') }}

      - name: Install locked dependencies
        working-directory: classroom-app
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci

      - name: Prepare ONNX Runtime
        run: .github/scripts/prepare-onnxruntime-windows.ps1 -Version $env:ONNX_RUNTIME_VERSION

      - name: Download and verify face models
        working-directory: classroom-app
        run: npm run prepare:models

      - name: Build and test native face engine
        working-directory: classroom-app
        run: |
          node --test test/*.test.js
          npm run build:native
          npm run test:native

      - name: Configure optional Windows signing
        env:
          WINDOWS_CSC_LINK_SECRET: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK_SECRET)) {
            "CSC_LINK=$env:WINDOWS_CSC_LINK_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host '[signing] no certificate configured; building unsigned installer'
          }

      - name: Build NSIS installer
        working-directory: classroom-app
        run: npm run build:win:ci

      - name: Smoke-test unpacked app and installer
        run: |
          $installer = (Get-ChildItem 'classroom-app/dist/Banda-Classroom-*-Setup-x64.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Classroom installer was not generated' }
          .github/scripts/test-windows-installer.ps1 `
            -Installer $installer `
            -UnpackedExecutable 'classroom-app/dist/win-unpacked/Banda-Classroom.exe' `
            -InstalledExecutableName 'Banda-Classroom.exe' `
            -InstallFolderName 'Banda-Classroom-CI'

      - name: Upload classroom installer
        uses: actions/upload-artifact@v7
        with:
          name: classroom-windows-x64-${{ github.sha }}
          path: classroom-app/dist/Banda-Classroom-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

  teacher-windows:
    name: Teacher app (Windows x64)
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CSC_LINK != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: teacher-app/package-lock.json

      - name: Cache Electron toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-teacher-${{ hashFiles('teacher-app/package-lock.json') }}

      - name: Install locked dependencies
        working-directory: teacher-app
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci

      - name: Configure optional Windows signing
        env:
          WINDOWS_CSC_LINK_SECRET: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK_SECRET)) {
            "CSC_LINK=$env:WINDOWS_CSC_LINK_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host '[signing] no certificate configured; building unsigned installer'
          }

      - name: Build NSIS installer
        working-directory: teacher-app
        run: npm run build:win:ci

      - name: Smoke-test unpacked app and installer
        run: |
          $installer = (Get-ChildItem 'teacher-app/dist/Banda-Teacher-*-Setup-x64.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Teacher installer was not generated' }
          .github/scripts/test-windows-installer.ps1 `
            -Installer $installer `
            -UnpackedExecutable 'teacher-app/dist/win-unpacked/Banda-Teacher.exe' `
            -InstalledExecutableName 'Banda-Teacher.exe' `
            -InstallFolderName 'Banda-Teacher-CI'

      - name: Upload teacher installer
        uses: actions/upload-artifact@v7
        with:
          name: teacher-windows-x64-${{ github.sha }}
          path: teacher-app/dist/Banda-Teacher-*-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

  classroom-macos:
    name: Classroom app (macOS ${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            machine: x86_64
            onnx-arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            machine: arm64
            onnx-arch: arm64
            runner: macos-15
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CSC_LINK != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm native runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          sw_vers

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: classroom-app/package-lock.json

      - name: Cache Electron toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-${{ matrix.arch }}-electron-classroom-${{ hashFiles('classroom-app/package-lock.json') }}

      - name: Cache ONNX Runtime and verified models
        uses: actions/cache@v5
        with:
          path: |
            classroom-app/.cache/onnxruntime
            classroom-app/models/onnx/*.onnx
          key: macos-${{ matrix.arch }}-native-${{ env.ONNX_RUNTIME_VERSION }}-${{ hashFiles('classroom-app/models/onnx/models.json') }}

      - name: Install locked dependencies
        working-directory: classroom-app
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci

      - name: Prepare ONNX Runtime
        run: bash .github/scripts/prepare-onnxruntime-macos.sh "$ONNX_RUNTIME_VERSION" "${{ matrix.onnx-arch }}"

      - name: Download and verify face models
        working-directory: classroom-app
        run: npm run prepare:models

      - name: Build and test native face engine
        working-directory: classroom-app
        run: |
          node --test test/cloud-bridge.test.js
          npm run build:native
          file native/build/Release/face_native_addon.node | grep '${{ matrix.machine }}'
          npm run test:native

      - name: Configure optional macOS signing
        env:
          MACOS_CSC_LINK_SECRET: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD_SECRET: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_APPLE_ID_SECRET: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APPLE_APP_PASSWORD_SECRET: ${{ secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID_SECRET: ${{ secrets.MACOS_APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_CSC_LINK_SECRET" ]]; then
            {
              echo "CSC_LINK=$MACOS_CSC_LINK_SECRET"
              echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD_SECRET"
              echo "APPLE_ID=$MACOS_APPLE_ID_SECRET"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$MACOS_APPLE_APP_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$MACOS_APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo '[signing] Developer ID certificate configured'
          else
            echo '[signing] no certificate configured; building unsigned packages'
          fi

      - name: Build DMG installer
        working-directory: classroom-app
        run: |
          if [[ "$MACOS_SIGNING_ENABLED" == "true" ]]; then
            npm run build:mac:ci -- --${{ matrix.arch }} \
              --config.mac.hardenedRuntime=true --config.mac.notarize=true
          else
            # Ad-hoc signing gives every nested Electron/native binary a
            # consistent signature even when no Developer ID certificate is
            # configured. It is not notarization, but avoids a malformed
            # unsigned bundle being reported as “damaged” by Gatekeeper.
            npm run build:mac:ci -- --${{ matrix.arch }} \
              --config.mac.identity=- --config.mac.hardenedRuntime=false
          fi

      - name: Smoke-test application and DMG
        run: |
          app_path="$(find classroom-app/dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          dmg_path="$(find classroom-app/dist -maxdepth 1 -type f -name 'Banda-Classroom-*-macOS-${{ matrix.arch }}.dmg' -print -quit)"
          bash .github/scripts/test-macos-package.sh \
            "$app_path" "$dmg_path" 'Banda-Classroom' '${{ matrix.machine }}'

      - name: Upload classroom installer
        uses: actions/upload-artifact@v7
        with:
          name: classroom-macos-${{ matrix.arch }}-${{ github.sha }}
          path: classroom-app/dist/Banda-Classroom-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  teacher-macos:
    name: Teacher app (macOS ${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            machine: x86_64
            runner: macos-15-intel
          - arch: arm64
            machine: arm64
            runner: macos-15
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CSC_LINK != '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Confirm native runner architecture
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          sw_vers

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: teacher-app/package-lock.json

      - name: Cache Electron toolchains
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-${{ matrix.arch }}-electron-teacher-${{ hashFiles('teacher-app/package-lock.json') }}

      - name: Install locked dependencies
        working-directory: teacher-app
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci

      - name: Configure optional macOS signing
        env:
          MACOS_CSC_LINK_SECRET: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD_SECRET: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_APPLE_ID_SECRET: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APPLE_APP_PASSWORD_SECRET: ${{ secrets.MACOS_APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_APPLE_TEAM_ID_SECRET: ${{ secrets.MACOS_APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_CSC_LINK_SECRET" ]]; then
            {
              echo "CSC_LINK=$MACOS_CSC_LINK_SECRET"
              echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD_SECRET"
              echo "APPLE_ID=$MACOS_APPLE_ID_SECRET"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$MACOS_APPLE_APP_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$MACOS_APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
            echo '[signing] Developer ID certificate configured'
          else
            echo '[signing] no certificate configured; building unsigned packages'
          fi

      - name: Build DMG installer
        working-directory: teacher-app
        run: |
          if [[ "$MACOS_SIGNING_ENABLED" == "true" ]]; then
            npm run build:mac:ci -- --${{ matrix.arch }} \
              --config.mac.hardenedRuntime=true --config.mac.notarize=true
          else
            npm run build:mac:ci -- --${{ matrix.arch }} \
              --config.mac.identity=- --config.mac.hardenedRuntime=false
          fi

      - name: Smoke-test application and DMG
        run: |
          app_path="$(find teacher-app/dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          dmg_path="$(find teacher-app/dist -maxdepth 1 -type f -name 'Banda-Teacher-*-macOS-${{ matrix.arch }}.dmg' -print -quit)"
          bash .github/scripts/test-macos-package.sh \
            "$app_path" "$dmg_path" 'Banda-Teacher' '${{ matrix.machine }}'

      - name: Upload teacher installer
        uses: actions/upload-artifact@v7
        with:
          name: teacher-macos-${{ matrix.arch }}-${{ github.sha }}
          path: teacher-app/dist/Banda-Teacher-*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cloud-container, classroom-windows, teacher-windows, classroom-macos, teacher-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7

      - name: Download verified installers
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ github.sha }}'
          path: release
          merge-multiple: true

      - name: Generate download guide
        run: node .github/scripts/generate-release-notes.js release-notes.md

      - name: Generate release checksums
        run: |
          find release -mindepth 2 -type f -name '*.cdx.json' -exec cp '{}' release/ \;
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t installers < <(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) -print | sort)
          if [[ "${#installers[@]}" -ne 6 ]]; then
            echo "Expected 6 installers, found ${#installers[@]}" >&2
            printf '%s\n' "${installers[@]}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.dmg|*.txt|*.json) ;;
                *) gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes --repo "$GH_REPO" ;;
              esac
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" "${installers[@]}" release/SHA256SUMS.txt release/*.cdx.json --clobber --repo "$GH_REPO"
            gh release edit "$GITHUB_REF_NAME" --repo "$GH_REPO" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${installers[@]}" release/SHA256SUMS.txt release/*.cdx.json \
              --repo "$GH_REPO" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "$GITHUB_REF_NAME"
          fi
